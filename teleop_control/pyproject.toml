[project]
name = "data-platform-teleop-control"
version = "0.1.0"
description = "Host-side G2/Pico/XR control bridge for the robot data platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "mcap>=1.2.2,<2",
    "pillow>=10",
    "opencv-python-headless>=4.10,<5",
    "pydantic>=2.7",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.2", "ruff>=0.5"]

[project.scripts]
teleop-control = "teleop_control.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleop_control"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
