[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxis-studio-bridge"
version = "0.1.0"
description = "Galaxis Studio 桥接服务:聚合 ROS 2 采集状态并对外提供 HTTP/WS 接口"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
# ROS 2 环境由采集主机的系统环境提供,不在此声明
dev = ["pytest>=8"]

[project.scripts]
galaxis-studio-bridge = "galaxis_studio_bridge.main:main"

[tool.setuptools.packages.find]
include = ["galaxis_studio_bridge*"]
