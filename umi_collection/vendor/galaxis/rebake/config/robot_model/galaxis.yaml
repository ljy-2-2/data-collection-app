# Summary of fields referenced in this file
# This model matches the Galaxis portable rig: PICO, two MT7V0 grippers,
# and left/right/center USB cameras. It intentionally has no footpedal feature.
#
# Observations (states):
#   /tf_chain (each frame exposes transform / delta_transform / is_fresh)
#     - /pico_origin/pico_hmd                             : PICO HMD pose
#     - /pico_origin/pico_{left, right}_controller        : PICO controller pose
#     - /pico_origin/{left, right}_hand_root              : hand root pose
#     - /pico_origin/{left, right}_hand_cam_link          : hand camera link pose
#     - /pico_origin/{left, right}_{left, right}_finger_tip_link
#                                                         : finger tip pose
#                                                           (outer = hand side, inner = finger side)
#     - /left_hand_root/right_hand_root                   : right hand pose relative to left hand
#   /joint_states (each field exposes position / is_fresh)
#     - /position                                         : finger joint positions
#                                                           [left_left_finger_joint, right_right_finger_joint]
#     - /is_fresh                                         : freshness flag for the joint positions
#
#   For each pose above:
#     transform       -> absolute pose       [x, y, z, qx, qy, qz, qw]
#     delta_transform -> per-step delta pose [dx, dy, dz, dqx, dqy, dqz, dqw]
#     is_fresh        -> freshness flag for the absolute transform
#
# Observations (images):
#   /{left, right}_camera/image_raw/compressed         : side cameras (Video + /is_fresh)
#   /center_camera/image_raw/compressed                : center camera (Video + /is_fresh)
#
# Actions:
#   /tf_chain            /pico_origin/pico_{left, right}_controller/delta_transform + is_fresh
#                                                      : controller delta action
#   /joint_states/action /position + is_fresh         : finger joint position action
#                                                        [left_left_finger_joint, right_right_finger_joint]

# Observations (states)
- type: Parquet
  topic: /tf_chain
  field: /pico_origin/pico_hmd/transform
  feature: observation.pose.hmd.absolute
  names: [x, y, z, qx, qy, qz, qw]
- type: Parquet
  topic: /tf_chain
  field: /pico_origin/pico_hmd/delta_transform
  feature: observation.pose.hmd.relative
  names: [dx, dy, dz, dqx, dqy, dqz, dqw]
- type: Parquet
