# Galaxis ROS bag -> LeRobot v2.1 staging dataset.
# tools/rebake_lerobot_v30.py immediately converts this directory in place
# with the official local LeRobot v2.1 -> v3.0 converter.
work_dir: "/data/rebake_work"
save_contexts: false
stop_on_error: false
stage_configs:
  - Rosbag2IngestorConfig: {}
  - TfBufferEnricherConfig: {}
  - ZeroOrderHoldTimeSynchronizerConfig:
      fps: 30
  - TfChainEnricherConfig:
      frame_pairs:
        - source: pico_origin
          target: pico_hmd
        - source: pico_origin
          target: pico_left_controller
        - source: pico_origin
          target: pico_right_controller
        - source: pico_origin
          target: left_hand_root
        - source: pico_origin
          target: right_hand_root
        - source: pico_origin
          target: left_hand_cam_link
        - source: pico_origin
          target: right_hand_cam_link
        - source: pico_origin
          target: left_left_finger_tip_link
        - source: pico_origin
          target: left_right_finger_tip_link
        - source: pico_origin
          target: right_left_finger_tip_link
        - source: pico_origin
          target: right_right_finger_tip_link
        - source: left_hand_root
          target: right_hand_root
  - DeltaTransformEnricherConfig:
      topic_names: ["/tf_chain"]
      delta_reference_frame: previous_target_frame
  - ShiftEnricherConfig:
      source_topic: /joint_states
      output_topic: /joint_states/action
      shift_steps: 1
  - LeRobotV21TransformerConfig:
      outdir: "/data/lerobot_v21"
      robot_model: "./config/robot_model/galaxis.yaml"
      video_config:
        fps: 30
        gop: 30
        crf: "20"
        scaling: "Bicubic"
        codec_config:
          codec: "H264"
          preset: "medium"
      separate_per_primitive: true
