description "Independent bounded USB camera snapshot service"
start on runlevel [2345]
stop on runlevel [!2345]
respawn
respawn limit unlimited
post-stop script
    sleep 2
end script
kill timeout 10
umask 077
console log
pre-start script
    test -x /mnt/fusion-camera/capture || { stop; exit 0; }
    test -r /mnt/fusion-camera/server.json || { stop; exit 0; }
end script
exec /usr/bin/taskset -c 3 /usr/bin/nice -n 19 /usr/bin/python -B -u /mnt/fusion-camera/server.py --config /mnt/fusion-camera/server.json
